services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MIKROTIK_HOST: ${MIKROTIK_HOST}
      MIKROTIK_USERNAME: ${MIKROTIK_USERNAME}
      MIKROTIK_PASSWORD: ${MIKROTIK_PASSWORD}
      MIKROTIK_PORT: ${MIKROTIK_PORT}
      MIKROTIK_HOST_BACKUP: ${MIKROTIK_HOST_BACKUP}
      MIKROTIK_PORT_BACKUP: ${MIKROTIK_PORT_BACKUP}
      PAYGATEWS_GATEWAY_URL: ${PAYGATEWS_GATEWAY_URL}
      PAYGATEWS_API_KEY: ${PAYGATEWS_API_KEY}
      PAYGATEWS_CALLBACK_URL: ${PAYGATEWS_CALLBACK_URL}
      PAYGATEWS_TIMEOUT_SECONDS: ${PAYGATEWS_TIMEOUT_SECONDS}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./data:/app/data
